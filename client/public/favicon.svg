<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="50" cy="50" r="44" fill="#0B0F19" stroke="url(#grad1)" stroke-width="4" filter="url(#glow)"/>
  <!-- Latitude lines -->
  <ellipse cx="50" cy="50" rx="36" ry="16" stroke="#22D3EE" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.6"/>
  <line x1="14" y1="50" x2="86" y2="50" stroke="#8B5CF6" stroke-width="1.5" opacity="0.8"/>
  <ellipse cx="50" cy="50" rx="18" ry="38" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.6"/>
  <!-- Cloche / Encarta dish icon -->
  <path d="M32 58 C32 42, 68 42, 68 58 Z" fill="url(#grad1)" opacity="0.9"/>
  <circle cx="50" cy="40" r="3.5" fill="#22D3EE"/>
  <rect x="28" y="60" width="44" height="4" rx="2" fill="#22D3EE"/>
</svg>
